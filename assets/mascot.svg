<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Sloopy, a friendly gray robot in a scarlet jersey and buckeye necklace, holding a spatula and saying: Here's the real deal." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="520" rx="28" fill="#f4f1ea"/>
  <!-- ground -->
  <ellipse cx="270" cy="474" rx="170" ry="18" fill="#ded8cb"/>
  <!-- speech bubble -->
  <path d="M388 58h200a26 26 0 0 1 26 26v62a26 26 0 0 1-26 26H452l-44 38 8-38h-28a26 26 0 0 1-26-26V84a26 26 0 0 1 26-26z" fill="#fff" stroke="#2f3337" stroke-width="5"/>
  <text x="488" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#2f3337">Here's the</text>
  <text x="488" y="143" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#bb0000">real deal.</text>
  <!-- antenna -->
  <line x1="270" y1="78" x2="270" y2="44" stroke="#2f3337" stroke-width="7" stroke-linecap="round"/>
  <circle cx="270" cy="34" r="13" fill="#bb0000" stroke="#2f3337" stroke-width="5"/>
  <!-- ears -->
  <rect x="150" y="125" width="28" height="56" rx="10" fill="#7d858b" stroke="#2f3337" stroke-width="5"/>
  <rect x="362" y="125" width="28" height="56" rx="10" fill="#7d858b" stroke="#2f3337" stroke-width="5"/>
  <!-- head -->
  <rect x="172" y="78" width="196" height="150" rx="34" fill="#b4bbc0" stroke="#2f3337" stroke-width="6"/>
  <rect x="195" y="104" width="150" height="72" rx="24" fill="#2f3337"/>
  <!-- eyes -->
  <circle cx="237" cy="139" r="15" fill="#fff"/>
  <circle cx="303" cy="139" r="15" fill="#fff"/>
  <circle cx="241" cy="141" r="6" fill="#2f3337"/>
  <circle cx="307" cy="141" r="6" fill="#2f3337"/>
  <!-- smile -->
  <path d="M232 192q38 26 76 0" fill="none" stroke="#2f3337" stroke-width="7" stroke-linecap="round"/>
  <!-- legs -->
  <rect x="208" y="388" width="48" height="74" rx="12" fill="#7d858b" stroke="#2f3337" stroke-width="6"/>
  <rect x="284" y="388" width="48" height="74" rx="12" fill="#7d858b" stroke="#2f3337" stroke-width="6"/>
  <rect x="194" y="450" width="70" height="26" rx="12" fill="#2f3337"/>
  <rect x="276" y="450" width="70" height="26" rx="12" fill="#2f3337"/>
  <!-- left arm, waving -->
  <path d="M176 280 Q118 262 104 200" fill="none" stroke="#2f3337" stroke-width="30" stroke-linecap="round"/>
  <path d="M176 280 Q118 262 104 200" fill="none" stroke="#b4bbc0" stroke-width="19" stroke-linecap="round"/>
  <circle cx="102" cy="184" r="24" fill="#b4bbc0" stroke="#2f3337" stroke-width="6"/>
  <!-- right arm with spatula -->
  <rect x="470" y="222" width="52" height="62" rx="7" fill="#7d858b" stroke="#2f3337" stroke-width="6" transform="rotate(16 496 253)"/>
  <line x1="470" y1="346" x2="490" y2="284" stroke="#2f3337" stroke-width="10" stroke-linecap="round"/>
  <path d="M362 290 Q420 350 466 350" fill="none" stroke="#2f3337" stroke-width="30" stroke-linecap="round"/>
  <path d="M362 290 Q420 350 466 350" fill="none" stroke="#b4bbc0" stroke-width="19" stroke-linecap="round"/>
  <circle cx="470" cy="350" r="23" fill="#b4bbc0" stroke="#2f3337" stroke-width="6"/>
  <!-- jersey -->
  <path d="M176 246 Q270 226 364 246 L376 400 H164 Z" fill="#bb0000" stroke="#2f3337" stroke-width="6" stroke-linejoin="round"/>
  <path d="M170 372h200v12H170z" fill="#fff"/>
  <text x="270" y="356" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#fff">1</text>
  <!-- buckeye necklace -->
  <path d="M210 244 Q270 296 330 244" fill="none" stroke="#2f3337" stroke-width="3"/>
  <g stroke="#2f3337" stroke-width="2.5">
    <circle cx="224" cy="257" r="9" fill="#5c3317"/>
    <circle cx="246" cy="269" r="9" fill="#5c3317"/>
    <circle cx="270" cy="274" r="11" fill="#5c3317"/>
    <circle cx="294" cy="269" r="9" fill="#5c3317"/>
    <circle cx="316" cy="257" r="9" fill="#5c3317"/>
  </g>
  <g fill="#d8b98c">
    <circle cx="222" cy="255" r="3"/><circle cx="244" cy="267" r="3"/><circle cx="267" cy="271" r="4"/><circle cx="292" cy="267" r="3"/><circle cx="314" cy="255" r="3"/>
  </g>
</svg>
